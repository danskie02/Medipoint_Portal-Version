# MediPoint Supabase local/dev configuration
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "medipoint"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[functions.kiosk-qr-login]
verify_jwt = false
entrypoint = "./functions/kiosk-qr-login/index.ts"

[functions.update-profile]
verify_jwt = false
entrypoint = "./functions/update-profile/index.ts"

[functions.doctor-data]
verify_jwt = false
entrypoint = "./functions/doctor-data/index.ts"

[functions.kiosk-id-login]
verify_jwt = false
entrypoint = "./functions/kiosk-id-login/index.ts"

[functions.kiosk-signup]
verify_jwt = false
entrypoint = "./functions/kiosk-signup/index.ts"

[functions.portal-auth]
verify_jwt = false
entrypoint = "./functions/portal-auth/index.ts"

[functions.store-assessment]
verify_jwt = false
entrypoint = "./functions/store-assessment/index.ts"

[functions.data-retrieval]
verify_jwt = false
entrypoint = "./functions/data-retrieval/index.ts"
