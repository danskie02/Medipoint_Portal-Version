<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediPoint - History</title>
  <link rel="stylesheet" href="system-base.css" />
  <link rel="stylesheet" href="system-components.css" />
  <link rel="stylesheet" href="history.css" />
</head>

<body>
  <div class="portal-shell">
    <aside class="side-panel" aria-label="Portal navigation">
      <a href="../index.html" class="brand-block" aria-label="Go to MediPoint home">
        <img src="../../images/MediPointLogo.png" alt="MediPoint Logo" class="logo" />
      </a>

      <div class="side-user">
        <div class="avatar" id="userInitials">GU</div>
        <div>
          <strong id="userShort">Guest User</strong>
          <span id="sideRole">Student</span>
        </div>
      </div>

      <nav class="side-nav">
        <a href="portal.html"><svg class="nav-icon" aria-hidden="true"><use href="nav-icons.svg#overview"></use></svg> Overview</a>
        <a href="profile.html"><svg class="nav-icon" aria-hidden="true"><use href="nav-icons.svg#profile"></use></svg> My Profile</a>
        <a href="results.html"><svg class="nav-icon" aria-hidden="true"><use href="nav-icons.svg#results"></use></svg> Latest Results</a>
        <a href="assessment.html"><svg class="nav-icon" aria-hidden="true"><use href="nav-icons.svg#assessment"></use></svg> Analytics</a>
        <a href="history.html"><svg class="nav-icon" aria-hidden="true"><use href="nav-icons.svg#history"></use></svg> History</a>
        <a href="requests.html"><svg class="nav-icon" aria-hidden="true"><use href="nav-icons.svg#assessment"></use></svg> Requests</a>
      </nav>

      <div class="side-footer">
        <span>Need help?</span>
        <strong>Visit the clinic desk</strong>
      </div>
    </aside>

    <div class="portal-content">
      <header class="portal-header">
        <div>
          <p>Tracking Portal</p>
          <h1>History</h1>
        </div>

        <div class="header-actions">
          <span id="todayStamp">Today</span>
          <a href="../index.html" class="home-btn">Home</a>
        </div>
      </header>

      <main class="dashboard">
        <section class="history-panel" id="history">
          <div class="section-heading">
            <div>
              <h2>Visit History</h2>
              <p>Assessments, clinic requests, and follow-up updates, newest first.</p>
            </div>
          </div>

          <div id="historyList" class="history-list" aria-live="polite"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script src="portal.js"></script>
</body>
</html>
