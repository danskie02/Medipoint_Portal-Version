<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediPoint - Latest Results</title>
  <link rel="stylesheet" href="system-base.css" />
  <link rel="stylesheet" href="system-components.css" />
  <link rel="stylesheet" href="results.css" />
</head>

<body>
  <div class="portal-shell">
    <aside class="side-panel" aria-label="Portal navigation">
      <a href="portal.html" class="brand-block" aria-label="Go to MediPoint home">
        <img src="../../images/MediPointLogo.svg" alt="MediPoint Logo" class="logo" />
      </a>

      <div class="side-user">
        <div class="avatar" id="userInitials">GU</div>
        <div>
          <strong id="userShort">Guest User</strong>
          <span id="sideRole">Student</span>
        </div>
      </div>

      <nav class="side-nav">
        <a href="portal.html"><span>OV</span> Overview</a>
        <a href="profile.html"><span>MP</span> My Profile</a>
        <a href="results.html"><span>LR</span> Latest Results</a>
        <a href="assessment.html"><span>AS</span> Assessment</a>
        <a href="history.html"><span>HI</span> History</a>
      </nav>

      <div class="side-footer">
        <span>Need help?</span>
        <strong>Visit the clinic desk</strong>
      </div>
    </aside>

    <div class="portal-content">
      <header class="portal-header">
        <div>
          <p>Tracking Portal</p>
          <h1>Latest Results</h1>
        </div>

        <div class="header-actions">
          <span id="todayStamp">Today</span>
          <button type="button" class="home-btn" id="portalLogoutBtn">Sign out</button>
        </div>
      </header>

      <main class="dashboard">
        <section class="status-row">
          <article class="status-card all active" data-filter="All">
            <span>All Results</span>
            <strong id="allCount">0</strong>
          </article>

          <article class="status-card normal" data-filter="Normal">
            <span>Normal</span>
            <strong id="normalCount">0</strong>
          </article>

          <article class="status-card warning" data-filter="Warning">
            <span>Warning</span>
            <strong id="warningCount">0</strong>
          </article>

          <article class="status-card critical" data-filter="Critical">
            <span>Critical</span>
            <strong id="criticalCount">0</strong>
          </article>
        </section>

        <section class="results-panel" id="results">
          <div class="section-heading">
            <div>
              <h2>Latest Results</h2>
              <p>Your most recent kiosk measurements.</p>
            </div>

            <input type="text" id="searchInput" placeholder="Search result..." />
          </div>

          <div class="results-grid" id="resultsGrid"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../login-pages/medipoint-config.js"></script>
  <script src="../shared.js"></script>
  <script src="../login-pages/kiosk-api.js"></script>
  <script src="../caremate.js"></script>
  <script src="portal.js"></script>
</body>

</html>
